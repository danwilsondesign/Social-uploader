<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Social Post Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=PT+Serif&display=swap" rel="stylesheet">
<style>
  @font-face {
    font-family: "Wilden";
    src: url("fonts/wilden-regular.woff") format("woff");
    font-display: block;
  }
  :root {
    --bg: #f5f3ef;
    --panel: #ffffff;
    --text: #1d1b19;
    --muted: #6b655e;
    --border: #ddd7cf;
    --accent: #f0531c;
    --accent-text: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161412; --panel: #211e1b; --text: #f2ede6; --muted: #a39b91; --border: #3a352f;
    }
  }
  :root[data-theme="dark"] {
    --bg: #161412; --panel: #211e1b; --text: #f2ede6; --muted: #a39b91; --border: #3a352f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .app {
    display: grid;
    grid-template-columns: minmax(280px, 380px) 1fr;
    gap: 32px;
    max-width: 1200px;
    margin: 0 auto;
    padding: 32px 16px;
  }
  .tabs, .mobile-download, .thumb { display: none; }
  @media (max-width: 760px) {
    .app { grid-template-columns: 1fr; padding-top: 0; gap: 0; }
    .preview { position: static; }
    .tabs {
      display: flex;
      position: sticky;
      top: 0;
      z-index: 2;
      gap: 4px;
      margin: 0 -16px 16px;
      padding: 8px 16px;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
    }
    .tabs button {
      flex: 1;
      padding: 10px;
      background: none;
      color: var(--muted);
      border-radius: 8px;
    }
    .tabs button[aria-selected="true"] { background: var(--panel); color: var(--text); box-shadow: inset 0 0 0 1px var(--border); }
    .app[data-tab="preview"] #details-panel,
    .app[data-tab="details"] #preview-panel { display: none; }
    .mobile-download { display: block; width: 100%; margin-top: 16px; }
    .thumb { display: block; width: 144px; height: auto; margin: 0 auto 4px; border-radius: 6px; }
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .intro { color: var(--muted); margin: 0 0 24px; }
  form {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    display: grid;
    gap: 18px;
    align-self: start;
  }
  label { display: grid; gap: 6px; font-weight: 600; font-size: 14px; }
  .hint { font-weight: 400; color: var(--muted); font-size: 13px; }
  .group { display: grid; gap: 18px; }
  [hidden] { display: none !important; }
  input[type="text"], textarea, select {
    font: inherit;
    font-weight: 400;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg);
    color: var(--text);
    width: 100%;
  }
  textarea { resize: vertical; min-height: 72px; }
  input[type="file"] { font: inherit; font-weight: 400; }
  input[type="range"] { width: 100%; accent-color: var(--accent); }
  fieldset { border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin: 0; display: grid; gap: 10px; }
  legend { font-weight: 600; font-size: 14px; padding: 0 4px; }
  fieldset label { font-weight: 400; font-size: 13px; }
  button {
    font: inherit;
    font-weight: 600;
    padding: 12px 16px;
    border: 0;
    border-radius: 8px;
    background: var(--accent);
    color: var(--accent-text);
    cursor: pointer;
  }
  button:hover { filter: brightness(1.05); }
  .preview { position: sticky; top: 32px; align-self: start; }
  canvas {
    display: block;
    width: 100%;
    max-width: 640px;
    height: auto;
    border-radius: 8px;
    box-shadow: 0 8px 32px rgba(0,0,0,.18);
  }
  .size { color: var(--muted); font-size: 13px; margin-top: 8px; }
  /* Taller formats get narrower so the whole preview fits on screen. */
  .stage { position: relative; isolation: isolate; width: 100%; max-width: min(640px, calc((100vh - 120px) * var(--ratio, 0.8))); }
  /* Inset so the preview's rounded corners don't reveal it. */
  .source-video { position: absolute; inset: 12px; width: calc(100% - 24px); height: calc(100% - 24px); object-fit: cover; z-index: -1; pointer-events: none; }
  .segmented { grid-template-columns: 1fr 1fr; gap: 6px; padding: 6px; }
  .segmented legend { margin-bottom: 4px; }
  .segmented label {
    display: block;
    padding: 8px 10px;
    border-radius: 6px;
    text-align: center;
    font-weight: 600;
    cursor: pointer;
  }
  .segmented label span { display: block; font-weight: 400; font-size: 12px; color: var(--muted); }
  .segmented input { position: absolute; opacity: 0; pointer-events: none; }
  .segmented label:has(input:checked) { background: var(--accent); color: var(--accent-text); }
  .segmented label:has(input:checked) span { color: inherit; opacity: .85; }
  .segmented label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
  .hit {
    position: absolute;
    padding: 0;
    background: none;
    border: 2px dashed transparent;
    border-radius: 6px;
    cursor: text;
  }
  .hit:hover, .hit:focus-visible { border-color: rgba(255,255,255,.75); outline: none; }
  .hit.empty {
    border-color: rgba(255,255,255,.5);
    background: rgba(0,0,0,.25);
    color: rgba(255,255,255,.85);
    font: 600 13px/1 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .editor {
    position: absolute;
    margin: 0;
    padding: 0;
    border: 0;
    border-radius: 0;
    outline: 2px dashed rgba(255,255,255,.85);
    outline-offset: 6px;
    background: transparent;
    resize: none;
    overflow: hidden;
    text-align: center;
    white-space: pre-wrap;
    min-height: 0;
  }
  .editor[hidden] { display: none; }
</style>
</head>
<body>
<main class="app" data-tab="preview">
  <div class="tabs" role="tablist" aria-label="View">
    <button type="button" role="tab" id="tab-preview" aria-controls="preview-panel" aria-selected="true">Preview</button>
    <button type="button" role="tab" id="tab-details" aria-controls="details-panel" aria-selected="false" tabindex="-1">Details</button>
  </div>
  <section id="details-panel" role="tabpanel" aria-labelledby="tab-details">
    <h1>Social post builder</h1>
    <p class="intro">Click the text on the preview to edit it, or use the fields below. Then download it as a JPEG.</p>
    <form id="form" autocomplete="off">
      <label>Template
        <select id="template">
          <option value="photo">Full bleed photo</option>
          <option value="split">Split photo</option>
          <option value="message">Message</option>
        </select>
      </label>
      <fieldset class="segmented">
        <legend>Format</legend>
        <label><input type="radio" name="format" value="post" checked> Post <span>1080 × 1350</span></label>
        <label><input type="radio" name="format" value="story"> Story <span>1080 × 1920</span></label>
      </fieldset>
      <div class="group" data-photo-controls>
        <label>Image or video
          <input type="file" id="image" accept="image/*,video/*">
          <span class="hint">Fills the frame. Use the controls below to reframe it. Videos download as video, up to 60 seconds.</span>
        </label>
        <fieldset>
          <legend>Image framing</legend>
          <canvas id="thumb" class="thumb" width="432" height="540" aria-hidden="true"></canvas>
          <label>Zoom <input type="range" id="zoom" min="1" max="3" step="0.01" value="1"></label>
          <label>Horizontal position <input type="range" id="posX" min="0" max="100" step="1" value="50"></label>
          <label>Vertical position <input type="range" id="posY" min="0" max="100" step="1" value="50"></label>
        </fieldset>
      </div>
      <label data-field-row="heading">Heading
        <textarea id="heading" rows="2">Large heading goes here</textarea>
      </label>
      <label data-field-row="summary">Summary
        <textarea id="summary" rows="2">Description text goes here</textarea>
      </label>
      <label data-field-row="cta">Call to action
        <textarea id="cta" rows="1">Sunday 6th dec</textarea>
      </label>
      <button type="button" id="download" data-download>Download JPEG</button>
    </form>
  </section>
  <section class="preview" id="preview-panel" role="tabpanel" aria-labelledby="tab-preview">
    <div class="stage" id="stage">
      <canvas id="canvas" width="1080" height="1350" aria-label="Preview of the social post"></canvas>
      <button type="button" class="hit" data-field="heading" aria-label="Edit heading"></button>
      <button type="button" class="hit" data-field="summary" aria-label="Edit summary"></button>
      <button type="button" class="hit" data-field="cta" aria-label="Edit call to action"></button>
      <textarea class="editor" id="editor" hidden spellcheck="true"></textarea>
    </div>
    <button type="button" class="mobile-download" data-download>Download JPEG</button>
    <p class="size" id="size">Output: 1080 × 1350 px JPEG</p>
  </section>
</main>

<script>
const W = 1080;
const SHADOW = { y: 11.077, blur: 55.385, colour: "rgba(0,0,0,0.2)" };

// Post is the size the Figma frames were designed at. Story adds height. An inset moves the
// logo and text further in from the top and bottom edges; both currently use the same padding.
const FORMATS = {
  post:  { h: 1350, inset: 0 },
  story: { h: 1920, inset: 0 },
};
let H = FORMATS.post.h, INSET = FORMATS.post.inset;

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const $ = (id) => document.getElementById(id);

let photo = null;
const logo = new Image();
const splitMask = new Image();
let leafShapes = []; // Message template leaves: { path, fill, cy }

// Each template sets its fields, text styles, background and where its text blocks sit.
// place() gets the laid-out blocks (keyed by field) and returns each block's top edge.
// Values are taken from the matching Figma frames (1080 × 1350).
const TEMPLATES = {
  // Figma frame "Full bleed date"
  photo: {
    fields: ["heading", "summary", "cta"],
    usesPhoto: true,
    styles: {
      heading: { family: '"Wilden"', size: 80, lineHeight: 80, tracking: 12, colour: "#ffa74f", width: 913.846, shadow: true, trimmed: true },
      summary: { family: '"PT Serif"', size: 40, lineHeight: 60, tracking: 0, colour: "#f7dfba", width: 913.846, shadow: true },
      cta:     { family: '"Wilden"', size: 40, lineHeight: 40, tracking: 6, colour: "#f0531c", width: 780, shadow: false },
    },
    drawBackground() {
      ctx.fillStyle = "#000";
      ctx.fillRect(0, 0, W, H);
      if (photo) drawCover(photo);
      const grad = ctx.createLinearGradient(0, 0, 0, H);
      grad.addColorStop(0, "rgba(0,0,0,0.3)");
      grad.addColorStop(0.3, "rgba(0,0,0,0)");
      grad.addColorStop(1, "rgba(0,0,0,0.9)");
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, W, H);
      // Logo SVG is 112.758 square in a 110.769 tall slot at the top padding.
      if (logo.complete && logo.naturalWidth) {
        ctx.drawImage(logo, (W - 112.758) / 2, 100 + INSET - (112.758 - 110.769) / 2, 112.758, 112.758);
      }
    },
    place: (blocks) => stackFromBottom(blocks, 40),
  },

  // Figma frame "split"
  split: {
    fields: ["heading", "summary", "cta"],
    usesPhoto: true,
    styles: {
      heading: { family: '"Wilden"', size: 70, lineHeight: 70, tracking: 10.5, colour: "#ffa74f", width: 880, shadow: false },
      summary: { family: '"PT Serif"', size: 40, lineHeight: 60, tracking: 0, colour: "#f7dfba", width: 803.077, shadow: true },
      cta:     { family: '"Wilden"', size: 40, lineHeight: 40, tracking: 4, colour: "#f0531c", width: 880, shadow: true, trimmed: true },
    },
    // Photo is clipped to the wavy "Union" shape; the mask is that shape's alpha, exported from Figma.
    // As in Figma's auto layout, the photo fills the space above the text, less a 100 gap,
    // so more text means a shorter photo. The wave keeps its size and sits on the photo's bottom edge.
    drawBackground(textTop) {
      ctx.fillStyle = "#2e4b3c";
      ctx.fillRect(0, 0, W, H);
      if (!photo || !splitMask.complete || !splitMask.naturalWidth) return;
      const MASK_H = 866.631, SOLID_H = 742; // mask is solid down to 742, then the wave
      const box = { x: -13.854, y: 0, w: 1107.708, h: Math.max(textTop - 100, 0) };
      const maskTop = box.y + box.h - MASK_H;

      const s = scratch("shape");
      s.fillRect(box.x, box.y, box.w, Math.max(maskTop + SOLID_H - box.y, 0));
      s.drawImage(splitMask, box.x, maskTop, box.w, MASK_H);

      const o = scratch("photo");
      drawCover(photo, o, box);
      o.globalCompositeOperation = "destination-in";
      o.drawImage(s.canvas, 0, 0);
      o.globalCompositeOperation = "source-over";
      ctx.drawImage(o.canvas, 0, 0);
    },
    place: (blocks) => stackFromBottom(blocks, 27.692),
  },

  // Figma frame "Message"
  message: {
    fields: ["heading", "cta"],
    usesPhoto: false,
    styles: {
      heading: { family: '"Wilden"', size: 80, lineHeight: 104, tracking: 12, colour: "#fbeed9", width: 771, shadow: true },
      cta:     { family: '"Wilden"', size: 50, lineHeight: 50, tracking: 5, colour: "#fbeed9", width: 913.846, shadow: true, trimmed: true },
    },
    drawBackground() {
      ctx.fillStyle = "#2e4b3c";
      ctx.fillRect(0, 0, W, H);
    },
    // Leaves sit above the text in Figma, in a 1255.244 tall group at (46, 45).
    // In a taller frame each leaf moves to keep its relative position, without being resized.
    drawForeground() {
      const stretch = (1255.244 + H - 1350) / 1255.244;
      for (const leaf of leafShapes) {
        ctx.save();
        ctx.translate(46, 45 + leaf.cy * (stretch - 1));
        ctx.fillStyle = leaf.fill;
        ctx.fill(leaf.path);
        ctx.restore();
      }
    },
    // Heading is centred in the frame; the CTA's cap height starts 235 above the bottom (y 1115 in a post).
    place(blocks) {
      const tops = {};
      if (blocks.heading) tops.heading = (H - blocks.heading.height) / 2;
      if (blocks.cta) tops.cta = H - 235 - INSET;
      return tops;
    },
  },
};

// Cleared, frame-sized working canvases, kept between draws because video redraws every frame.
const scratchCanvases = {};
function scratch(name) {
  const c = scratchCanvases[name] ??= document.createElement("canvas");
  if (c.width !== W || c.height !== H) { c.width = W; c.height = H; }
  const g = c.getContext("2d");
  g.clearRect(0, 0, W, H);
  return g;
}

// Stacks text blocks upwards from the bottom padding (100, plus the format's inset), with a fixed gap.
function stackFromBottom(blocks, gap) {
  const list = Object.values(blocks);
  const total = list.reduce((sum, b) => sum + b.height, 0) + gap * (list.length - 1);
  let y = H - 100 - INSET - total;
  const tops = {};
  for (const b of list) { tops[b.name] = y; y += b.height + gap; }
  return tops;
}

let template = TEMPLATES.photo;
const styleOf = (field) => template.styles[field];

// Field currently being edited on the preview, and where each text block was last drawn.
let editing = null;
let layout = {};

function loadImage(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = src;
  });
}

function setFont(style) {
  ctx.font = `${style.size}px ${style.family}`;
  ctx.letterSpacing = style.tracking + "px";
}

// Greedy word wrap that respects manual line breaks.
function wrap(text, maxWidth) {
  const lines = [];
  for (const para of text.split("\n")) {
    const words = para.trim().split(/\s+/).filter(Boolean);
    if (!words.length) { lines.push(""); continue; }
    let line = words[0];
    for (const word of words.slice(1)) {
      const test = line + " " + word;
      if (ctx.measureText(test).width <= maxWidth) line = test;
      else { lines.push(line); line = word; }
    }
    lines.push(line);
  }
  return lines;
}

// Draws the photo to cover a box (the whole frame by default), using the zoom and position controls.
function drawCover(img, target = ctx, box = { x: 0, y: 0, w: W, h: H }) {
  const iw = img.videoWidth || img.naturalWidth, ih = img.videoHeight || img.naturalHeight;
  if (!iw || !ih) return;
  const zoom = +$("zoom").value;
  const scale = Math.max(box.w / iw, box.h / ih) * zoom;
  const dw = iw * scale, dh = ih * scale;
  const dx = box.x + (box.w - dw) * ($("posX").value / 100);
  const dy = box.y + (box.h - dh) * ($("posY").value / 100);
  target.save();
  target.beginPath();
  target.rect(box.x, box.y, box.w, box.h);
  target.clip();
  target.drawImage(img, dx, dy, dw, dh);
  target.restore();
}

// Lays out a text block and returns its height plus a draw function.
// style.trimmed = CSS text-box-trim (cap height to baseline), as on the Figma heading.
function block(text, style) {
  const trimmed = !!style.trimmed;
  setFont(style);
  const lines = wrap(text, style.width);
  const m = ctx.measureText("H");
  const asc = m.fontBoundingBoxAscent, desc = m.fontBoundingBoxDescent;
  const cap = m.actualBoundingBoxAscent;
  const baselineInLine = (style.lineHeight - (asc + desc)) / 2 + asc;
  const height = trimmed
    ? (lines.length - 1) * style.lineHeight + cap
    : lines.length * style.lineHeight;

  const draw = (top) => {
    setFont(style);
    ctx.fillStyle = style.colour;
    ctx.textAlign = "center";
    ctx.textBaseline = "alphabetic";
    if (style.shadow) {
      ctx.shadowColor = SHADOW.colour;
      ctx.shadowOffsetY = SHADOW.y;
      ctx.shadowBlur = SHADOW.blur;
    }
    lines.forEach((line, i) => {
      const baseline = trimmed
        ? top + cap + i * style.lineHeight
        : top + i * style.lineHeight + baselineInLine;
      // Canvas adds tracking after the last glyph as CSS does, so nudge to keep it optically centred.
      ctx.fillText(line, W / 2 + style.tracking / 2, baseline);
    });
    ctx.shadowColor = "transparent";
    ctx.shadowBlur = 0;
    ctx.shadowOffsetY = 0;
  };
  // Untrimmed line boxes, used to line the on-image editor up with the drawn text.
  const boxOffset = trimmed ? cap - baselineInLine : 0;
  const boxHeight = lines.length * style.lineHeight;
  return { height, draw, boxOffset, boxHeight, empty: !text.trim() };
}

// forExport leaves empty fields out entirely; the preview keeps a placeholder for them.
function render(forExport = false) {
  // In the preview an empty field keeps one line of space, so there is always something to click.
  const blocks = {};
  for (const name of template.fields) {
    const b = { name, ...block($(name).value, styleOf(name)) };
    if (!forExport || !b.empty) blocks[name] = b;
  }
  const tops = template.place(blocks);

  // Backgrounds can respond to where the text starts (the bottom padding if there is no text).
  const textTop = Math.min(H - 100 - INSET, ...Object.values(tops));
  ctx.clearRect(0, 0, W, H);
  template.drawBackground(textTop);

  layout = {};
  for (const b of Object.values(blocks)) {
    const y = tops[b.name];
    layout[b.name] = { top: y + b.boxOffset, height: b.boxHeight, empty: b.empty };
    // The field being edited is shown by the editor instead.
    if (b.name !== editing) b.draw(y);
  }

  template.drawForeground?.();
  positionOverlays();

  // Small copy for the framing controls on the mobile Details tab.
  const thumb = $("thumb");
  thumb.getContext("2d").drawImage(canvas, 0, 0, thumb.width, thumb.height);
}

// Places the click targets and the editor over the canvas, scaled to its displayed size.
function positionOverlays() {
  const s = canvas.clientWidth / W;
  if (!s) return;
  const HIT_PAD = 16;
  document.querySelectorAll(".hit").forEach((hit) => {
    const box = layout[hit.dataset.field];
    hit.hidden = !box || hit.dataset.field === editing;
    if (hit.hidden) return;
    hit.classList.toggle("empty", box.empty);
    hit.textContent = box.empty ? "Add " + hit.getAttribute("aria-label").replace(/^Edit /, "") : "";
    const w = styleOf(hit.dataset.field).width + HIT_PAD * 2;
    Object.assign(hit.style, {
      left: (W - w) / 2 * s + "px",
      top: (box.top - HIT_PAD) * s + "px",
      width: w * s + "px",
      height: (box.height + HIT_PAD * 2) * s + "px",
    });
  });

  const editor = $("editor");
  const box = editing && layout[editing];
  if (!box) return;
  const st = styleOf(editing);
  Object.assign(editor.style, {
    left: ((W - st.width) / 2 + st.tracking / 2) * s + "px",
    top: box.top * s + "px",
    width: st.width * s + "px",
    height: box.height * s + "px",
    fontFamily: st.family,
    fontSize: st.size * s + "px",
    lineHeight: st.lineHeight * s + "px",
    letterSpacing: st.tracking * s + "px",
    color: st.colour,
    caretColor: st.colour,
    textShadow: st.shadow ? `0 ${SHADOW.y * s}px ${SHADOW.blur * s}px ${SHADOW.colour}` : "none",
  });
}

function openEditor(name) {
  const editor = $("editor");
  editing = name;
  editor.value = $(name).value;
  editor.setAttribute("aria-label", $(name).closest("label").firstChild.textContent.trim());
  editor.hidden = false;
  render();
  editor.focus();
  editor.setSelectionRange(editor.value.length, editor.value.length);
}

function closeEditor() {
  if (!editing) return;
  editing = null;
  $("editor").hidden = true;
  render();
}

function slug(text) {
  return text.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 50) || "social-post";
}

// `photo` is the uploaded media: an image, or a video element that plays in the template.
const isVideo = () => photo instanceof HTMLVideoElement;
const MAX_VIDEO_SECONDS = 60;
let exporting = false;

function loadVideo(src) {
  return new Promise((resolve, reject) => {
    const video = document.createElement("video");
    // Muted and inline (as attributes too) so browsers, including iOS Safari, let it play on its own.
    for (const attr of ["muted", "loop", "playsinline", "autoplay"]) video.setAttribute(attr, "");
    Object.assign(video, { muted: true, loop: true, playsInline: true, preload: "auto" });
    // Safari only supplies frames for a video that's in the page and on screen, so it sits
    // directly behind the preview canvas, which covers it.
    video.className = "source-video";
    $("stage").prepend(video);
    const timer = setTimeout(() => reject(new Error("timeout")), 20000);
    video.addEventListener("loadeddata", () => { clearTimeout(timer); resolve(video); }, { once: true });
    video.addEventListener("error", () => { clearTimeout(timer); video.remove(); reject(video.error); }, { once: true });
    video.src = src;
    // iOS Safari doesn't load anything until playback starts, so start it straight away.
    video.play().catch(() => {});
  });
}

// Some browsers can't decode a file's picture (often iPhone HEVC video) but still load its sound.
const VIDEO_EXT = /\.(mp4|m4v|mov|webm|ogv|3gp)$/i;
const isVideoFile = (file) => file.type.startsWith("video/") || VIDEO_EXT.test(file.name);

// While a video is loaded, redraw every frame so the preview plays.
let playing = false;
function playLoop() {
  if (!isVideo() || exporting) { playing = false; return; }
  playing = true;
  render();
  requestAnimationFrame(playLoop);
}

$("image").addEventListener("change", async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const url = URL.createObjectURL(file);
  const wasVideo = isVideo() ? photo : null;
  const asVideo = isVideoFile(file);
  let media;
  try {
    media = asVideo ? await loadVideo(url) : await loadImage(url);
  } catch {
    alert(asVideo
      ? "This browser can't play that video. iPhone videos are often in HEVC format: try Safari, or set the iPhone camera to record in \"Most Compatible\" format (Settings → Camera → Formats)."
      : "That file could not be read as an image.");
    return;
  }
  if (asVideo && !media.videoWidth) {
    media.remove();
    alert("This browser can play that video's sound but not its picture. iPhone videos are often in HEVC format: try Safari, or set the iPhone camera to record in \"Most Compatible\" format (Settings → Camera → Formats).");
    return;
  }
  photo = media;
  if (wasVideo) { wasVideo.pause(); wasVideo.remove(); URL.revokeObjectURL(wasVideo.src); }
  $("zoom").value = 1; $("posX").value = 50; $("posY").value = 50;
  if (isVideo()) {
    photo.play().catch(() => {});
    if (!playing) playLoop();
    if (photo.duration > MAX_VIDEO_SECONDS) {
      alert(`This video is ${Math.round(photo.duration)} seconds long. Instagram splits stories into ${MAX_VIDEO_SECONDS}-second parts, so only the first ${MAX_VIDEO_SECONDS} seconds will be exported.`);
    }
  }
  updateDownloadLabels();
  render();
});

// Switching template keeps the text, and shows only the controls that template uses.
function applyTemplate() {
  closeEditor();
  template = TEMPLATES[$("template").value];
  document.querySelector("[data-photo-controls]").hidden = !template.usesPhoto;
  document.querySelectorAll("[data-field-row]").forEach((row) => {
    row.hidden = !template.fields.includes(row.dataset.fieldRow);
  });
  updateDownloadLabels();
  render();
}
$("template").addEventListener("change", applyTemplate);

// Never let the form submit: it would reload the page and lose everything.
$("form").addEventListener("submit", (e) => e.preventDefault());

$("form").addEventListener("input",(e) => { if (e.target.type !== "file") render(); });

document.querySelectorAll(".hit").forEach((hit) => {
  hit.addEventListener("click", () => openEditor(hit.dataset.field));
});

// The editor writes into the matching form field, which stays the single source of the text.
$("editor").addEventListener("input", (e) => {
  $(editing).value = e.target.value;
  render();
});
$("editor").addEventListener("blur", closeEditor);
$("editor").addEventListener("keydown", (e) => {
  if (e.key === "Escape") e.target.blur();
});

new ResizeObserver(positionOverlays).observe(canvas);

// Mobile only: switch between the preview and the details form.
const tabs = [$("tab-preview"), $("tab-details")];
function selectTab(tab) {
  tabs.forEach((t) => {
    const on = t === tab;
    t.setAttribute("aria-selected", on);
    t.tabIndex = on ? 0 : -1;
  });
  document.querySelector(".app").dataset.tab = tab.id.replace("tab-", "");
  window.scrollTo(0, 0);
  // Safari pauses a video while it's hidden on the other tab, so restart it on the way back.
  if (isVideo() && !exporting) photo.play().catch(() => {});
}
tabs.forEach((t, i) => {
  t.addEventListener("click", () => selectTab(t));
  t.addEventListener("keydown", (e) => {
    if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
    const next = tabs[(i + 1) % tabs.length];
    selectTab(next);
    next.focus();
  });
});

document.querySelectorAll("[data-download]").forEach((btn) => btn.addEventListener("click", download));

function updateDownloadLabels(text) {
  const video = isVideo() && template.usesPhoto;
  const label = text || (video ? "Download video" : "Download JPEG");
  $("size").textContent = `Output: ${W} × ${H} px ${video ? "video" : "JPEG"}`;
  document.querySelectorAll("[data-download]").forEach((btn) => {
    btn.textContent = label;
    btn.disabled = exporting;
  });
}

// MP4 is what Instagram needs; WebM is the fallback where a browser can't record MP4.
function videoMimeType() {
  if (!window.MediaRecorder) return null;
  return ["video/mp4;codecs=avc1.640028,mp4a.40.2", "video/mp4;codecs=avc1,mp4a.40.2", "video/mp4",
          "video/webm;codecs=vp9,opus", "video/webm"].find((t) => MediaRecorder.isTypeSupported(t));
}

function saveBlob(blob, ext) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = slug($("heading").value) + (H === FORMATS.story.h ? "-story" : "") + "." + ext;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

const once = (el, event) => new Promise((resolve) => el.addEventListener(event, resolve, { once: true }));

// Plays the video once from the start, recording the canvas and the video's sound as it goes.
async function exportVideo() {
  const mimeType = videoMimeType();
  if (!mimeType) {
    alert("This browser can't record video. Try the latest Chrome, Edge or Safari.");
    return;
  }
  const video = photo;
  // Sound is routed into the recording only, not the speakers. A browser only allows this
  // routing to be set up once per video, and the audio context has to start inside the click.
  video._audio ??= (() => {
    const ac = new AudioContext();
    const dest = ac.createMediaStreamDestination();
    ac.createMediaElementSource(video).connect(dest);
    return { ac, dest };
  })();
  video._audio.ac.resume();

  exporting = true;
  updateDownloadLabels("Exporting… 0%");
  $("form").inert = $("stage").inert = true;
  const end = Math.min(video.duration, MAX_VIDEO_SECONDS);
  let recorder;
  try {
    video.pause();
    video.loop = false;
    video.muted = false;
    video.currentTime = 0;
    await once(video, "seeked");
    render(true);

    const stream = canvas.captureStream(30);
    video._audio.dest.stream.getAudioTracks().forEach((t) => stream.addTrack(t));
    recorder = new MediaRecorder(stream, { mimeType, videoBitsPerSecond: 8_000_000 });
    const chunks = [];
    recorder.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
    const stopped = once(recorder, "stop");
    recorder.start(250);
    await video.play();

    // Frames are drawn on screen refreshes, so the tab has to stay visible while exporting.
    await new Promise((resolve) => {
      const frame = () => {
        render(true);
        const pct = Math.min(99, Math.round((video.currentTime / end) * 100));
        updateDownloadLabels(`Exporting… ${pct}% (keep this tab open)`);
        if (video.ended || video.currentTime >= end) return resolve();
        requestAnimationFrame(frame);
      };
      frame();
    });
    recorder.stop();
    await stopped;
    saveBlob(new Blob(chunks, { type: mimeType }), mimeType.startsWith("video/mp4") ? "mp4" : "webm");
  } catch (err) {
    if (recorder?.state === "recording") recorder.stop();
    alert("The video couldn't be exported in this browser. " + (err?.message || ""));
  } finally {
    exporting = false;
    $("form").inert = $("stage").inert = false;
    video.muted = true;
    video.loop = true;
    video.currentTime = 0;
    video.play().catch(() => {});
    updateDownloadLabels();
    playLoop();
  }
}

function download() {
  closeEditor();
  if (isVideo() && template.usesPhoto) return exportVideo();
  // toBlob copies the canvas straight away, so the preview can be restored right after.
  render(true);
  canvas.toBlob((blob) => saveBlob(blob, "jpg"), "image/jpeg", 0.92);
  render();
}

// Reads each leaf of the Message template's SVG as its own shape, so leaves can be moved individually.
async function loadLeaves() {
  const text = await (await fetch("assets/leaves.svg")).text();
  const svg = document.importNode(new DOMParser().parseFromString(text, "image/svg+xml").documentElement, true);
  // getBBox needs the SVG in the page; it stays invisible and is removed straight after.
  svg.style.cssText = "position:absolute;left:-9999px;visibility:hidden";
  document.body.append(svg);
  leafShapes = [...svg.querySelectorAll("path")].map((p) => {
    const box = p.getBBox();
    return { path: new Path2D(p.getAttribute("d")), fill: p.getAttribute("fill"), cy: box.y + box.height / 2 };
  });
  svg.remove();
}

// Switches between Post and Story sizes.
function applyFormat() {
  const format = FORMATS[document.querySelector('input[name="format"]:checked').value];
  closeEditor();
  H = format.h;
  INSET = format.inset;
  canvas.height = H;
  const thumb = $("thumb");
  thumb.height = Math.round(thumb.width * H / W);
  $("stage").style.setProperty("--ratio", W / H);
  updateDownloadLabels();
  render();
}
document.querySelectorAll('input[name="format"]').forEach((r) => r.addEventListener("change", applyFormat));

(async function init() {
  logo.src = "assets/logo.svg";
  splitMask.src = "assets/split-mask.png";
  await Promise.all([
    loadLeaves().catch(() => {}),
    splitMask.decode().catch(() => {}),
    document.fonts.load('80px "Wilden"'),
    document.fonts.load('40px "PT Serif"'),
    logo.decode().catch(() => {}),
    loadImage("assets/sample.jpg").then((img) => { photo = img; }).catch(() => {}),
  ]);
  // Browsers can restore the last template and format choices on reload.
  applyTemplate();
  applyFormat();
})();
</script>
</body>
</html>
